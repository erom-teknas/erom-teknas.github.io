---
layout: default
---

<article class="page container">
  <header class="page-head{% if page.portrait %} has-portrait{% endif %}">
    {% if page.portrait %}
      <img
        class="page-portrait"
        src="{{ page.portrait | relative_url }}"
        width="320"
        height="320"
        alt="Portrait of {{ site.social.name }}"
      >
    {% endif %}
    <div>
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.lede %}<p class="page-lede">{{ page.lede }}</p>{% endif %}
    </div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
