---
layout: default
---

<article class="page container">
  <header class="page-head">
    <p class="page-kicker"><a href="{{ '/categories/' | relative_url }}">Categories</a></p>
    <h1 class="page-title">{% include category-label.html name=page.title %}</h1>
    <p class="page-lede">{{ page.posts | size }} {% if page.posts.size == 1 %}post{% else %}posts{% endif %}</p>
  </header>
  {% include post-lines.html posts=page.posts %}
</article>
