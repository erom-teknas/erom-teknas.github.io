# Site configuration.
#
# The site uses its own theme (layouts in `_layouts`, styles in `_sass`, scripts
# in `assets/js`). See AGENTS.md for how the pieces fit together.

lang: en
timezone: America/Toronto

# --- Identity (also read by jekyll-seo-tag and the feed) ---

title: "Sanket More"
description: >-
  Hands-on DevOps guides to AWS, Kubernetes, Terraform and CI/CD, written by
  Sanket More.

# Protocol and hostname, without a trailing slash.
url: "https://erom-teknas.github.io"
baseurl: ""

github:
  username: erom-teknas

social:
  # Default author of posts and the copyright owner in the footer
  name: Sanket More
  email: erom.teknas@gmail.com
  links:
    - https://github.com/erom-teknas
    - https://www.linkedin.com/in/eromteknas

avatar: /assets/images/me/me.jpg
author_role: DevOps engineer

# Site-wide social preview image (`og:image`); a post's `image` overrides it.
social_preview_image:

google_site_verification:

# Global switch for the table of contents on posts
toc: true

# --- Comments (giscus, https://giscus.app) ---

comments:
  provider: giscus
  giscus:
    repo: "erom-teknas/erom-teknas.github.io"
    repo_id: "R_kgDOLiSeeg"
    category: "General"
    category_id: "DIC_kwDOLiSees4CeWR3"
    mapping: "pathname"
    reactions_enabled: "1"

# --- Content ---

paginate: 10
paginate_path: "/page:num/"

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # Do not change: every post URL on the live site depends on it.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

feed:
  path: feed.xml

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - LICENSE
  - package*.json
  - skills-lock.json
  - vendor
