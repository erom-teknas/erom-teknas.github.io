# Projects shown on the Projects tab (`_tabs/projects.md`, `_layouts/projects.html`).
#
# Fields:
#   name, kind      title and a short type label
#   tagline         one short line for the home page list
#   summary         one or two plain sentences on what it does
#   details         optional list of specifics
#   stack           optional list of main technologies
#   link            optional { url, label }; omit when there is no public page
#   image           optional { src, alt }; 520x800 (13:20) images read best

- name: Pact
  kind: Web app
  tagline: Group habit challenges with a live leaderboard.
  summary: >-
    Group habit challenges with a live leaderboard. Friends join a group with a
    six-character PIN and compete on five daily habits.
  details:
    - The group votes on five shared habits, or each member picks their own five.
    - A done habit is a point and a perfect day adds a bonus; the table updates live.
    - Spot-checks and timed habits keep the honor system honest.
  stack: [React, Vite, Supabase, PWA]
  link:
    url: https://pact-deploy.vercel.app
    label: Open Pact
  image:
    src: /assets/images/projects/pact.jpg
    alt: Pact's start screen, showing a sample group leaderboard with points and streaks

- name: explainer-engine
  kind: Explainer pipeline
  tagline: Automated true-crime explainer Shorts about closed cases.
  summary: >-
    An automated pipeline that researches, scripts, narrates and renders 40 to 60
    second true-crime explainers, only about cases a court has closed, such as a
    conviction or a guilty plea, never an open investigation.
  details:
    - JSON-driven Remotion compositions render vertical 1080x1920 video.
    - Scripts are written from a pinned Wikipedia article and checked claim by claim before rendering.
    - Narration is generated with ElevenLabs and timed word by word to the picture.
  stack: [Remotion, TypeScript, ElevenLabs, YouTube Data API]
  image:
    src: /assets/images/projects/explainer-engine.jpg
    alt: Cover of an explainer on the 1911 theft of the Mona Lisa

- name: shorts-engine
  kind: Video pipeline
  tagline: Turns long-form video into captioned vertical shorts.
  summary: >-
    A self-hosted pipeline that turns long-form video, such as podcasts, interviews
    and streams, into vertical 9:16 shorts with word-timed captions.
  details:
    - Transcribes with Whisper, detects the active speaker and frames the shot around their face.
    - Cuts between wide and close shots on speaker changes and emphasis, like a hand-edited clip.
    - An autopilot finds new uploads from tracked channels and publishes on a fixed daily schedule.
  stack: [Python, faster-whisper, OpenCV, FFmpeg]
