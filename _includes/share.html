{%- assign _url = page.url | absolute_url | url_encode -%}
{%- assign _title = page.title | url_encode -%}
<div class="share" aria-label="Share this post">
  <span class="share-label">Share</span>
  <a class="icon-btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ _url }}" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn">
    {% include icon.html name="linkedin-logo" %}
  </a>
  <a class="icon-btn" href="https://twitter.com/intent/tweet?text={{ _title }}&amp;url={{ _url }}" target="_blank" rel="noopener noreferrer" aria-label="Share on X">
    <span class="share-x" aria-hidden="true">X</span>
  </a>
  <button type="button" class="icon-btn" data-copy-link aria-label="Copy link to this post">
    {% include icon.html name="link-simple" %}
  </button>
</div>
