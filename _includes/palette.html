<dialog class="palette" id="palette" aria-label="Search posts" data-index="{{ '/assets/search.json' | relative_url }}">
  <form class="palette-form" role="search" method="dialog">
    {% include icon.html name="magnifying-glass" class="palette-icon" %}
    <input
      class="palette-input"
      id="palette-input"
      type="search"
      placeholder="Search posts, topics and tags"
      autocomplete="off"
      spellcheck="false"
      aria-label="Search posts, topics and tags"
      aria-controls="palette-results"
      aria-autocomplete="list"
    >
    <kbd class="palette-esc" aria-hidden="true">Esc</kbd>
  </form>
  <div class="palette-body">
    <ul class="palette-results" id="palette-results" role="listbox" aria-label="Results"></ul>
    <p class="palette-empty" hidden>No posts match that search.</p>
  </div>
  <div class="palette-foot" aria-hidden="true">
    <span><kbd>↑</kbd><kbd>↓</kbd> to move</span>
    <span><kbd>Enter</kbd> to open</span>
  </div>
</dialog>
